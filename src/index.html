<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计时器</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <button id="settings-btn" class="settings-btn" title="设置" aria-label="设置">⚙</button>

  <div class="container">
    <div class="left-area">
      <div id="error-msg" class="error"></div>
      <div id="tab-list" class="tab-list"></div>
    </div>

    <div class="right-area">
      <div id="timer" class="timer">03:00</div>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settings-overlay" class="settings-overlay" style="display:none">
    <div class="settings-panel">
      <div class="settings-header">
        <span class="settings-title">设置</span>
        <button id="settings-close" class="settings-close" aria-label="关闭">×</button>
      </div>
      <div class="settings-body">
        <div class="settings-item">
          <span class="settings-label">监听按键</span>
          <select id="listen-key-select">
            <option value="1">F1</option>
            <option value="2">F2</option>
            <option value="3">F3</option>
            <option value="4" selected>F4</option>
            <option value="5">F5</option>
            <option value="6">F6</option>
            <option value="7">F7</option>
            <option value="8">F8</option>
            <option value="9">F9</option>
          </select>
        </div>
        <div class="settings-item">
          <span class="settings-label">截取区域</span>
          <button id="select-region-btn">框选截取区域</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen overlay for region selection -->
  <div id="select-overlay" class="select-overlay" style="display:none">
    <canvas id="select-canvas"></canvas>
    <div class="select-hint">拖拽框选需要截取的区域，松开确认</div>
  </div>

  <div class="version">v0.4.0</div>
</body>
</html>
